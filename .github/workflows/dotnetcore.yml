name: Build and Test
on: [push, pull_request]
jobs:
  Build_and_Test:
    runs-on: ubuntu-latest
    steps:
    # Actions are pinned to a commit SHA because tags are mutable and can be repointed at hostile code.
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
    - name: Restore Dependencies
      run: dotnet restore --locked-mode
    # Debug and Release might be different due to conditional compilation, so validate both.
    - name: Build (Debug)
      run: dotnet build --configuration Debug --no-restore
    - name: Build (Release)
      run: dotnet build --configuration Release --no-restore
    - name: Test (Debug)
      run: dotnet test --configuration Debug --no-build --nologo
    - name: Test (Release)
      run: dotnet test --configuration Release --no-build --nologo
